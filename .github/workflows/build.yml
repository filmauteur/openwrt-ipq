name: QHora-301W Build (24.10-nss)

on:
  workflow_dispatch: # 手动触发

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: 24.10-nss # 强制指定分支

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      - name: Update and Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Device (QHora-301W)
        run: |
          # 1. 先使用项目自带的 NSS 种子配置
          cp nss-setup/config-nss.seed .config
          
          # 2. 注入 301W 硬件信息和基础插件
          cat >> .config <<EOF
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq807x=y
          CONFIG_TARGET_qualcommax_ipq807x_DEVICE_qnap_qhora-301w=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-app-turboacc=y
          CONFIG_PACKAGE_kmod-qca-nss-drv=y
          CONFIG_PACKAGE_kmod-qca-nss-ecm=y
          EOF
          
          # 3. 展开配置并补全依赖
          make defconfig

      - name: Download Sources
        run: make download -j8 V=s

      - name: Build Firmware
        run: make -j$(nproc) V=s

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QHora-301W-NSS-24.10
          path: bin/targets/qualcommax/ipq807x/*.itb
          # 或者 *.bin，取决于编译出的文件格式
