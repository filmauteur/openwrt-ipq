name: Build OpenWrt

on:
  workflow_dispatch: # 允许手动点击按钮触发

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget
          
      - name: Update & Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom config
        run: |
          # 使用 qosmio 提供的 NSS 基础配置
          cp nss-setup/config-nss.seed .config
          # 强制开启 QHora-301W 设备支持
          echo "CONFIG_TARGET_qualcommax=y" >> .config
          echo "CONFIG_TARGET_qualcommax_ipq807x=y" >> .config
          echo "CONFIG_TARGET_qualcommax_ipq807x_DEVICE_qnap_qhora-301w=y" >> .config
          # 基础 UI
          echo "CONFIG_PACKAGE_luci=y" >> .config
          make defconfig

      - name: Download package
        run: make download -j8

      - name: Compile the firmware
        run: make -j$(nproc) V=s

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QHora-301W-NSS-Firmware
          path: bin/targets/qualcommax/ipq807x/*
